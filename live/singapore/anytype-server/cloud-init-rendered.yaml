#cloud-config
package_update: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable docker
  - systemctl start docker
  - ufw allow 22/tcp
  - ufw allow 33010/tcp
  - ufw allow 33020/udp
  - ufw --force enable
  - export EXTERNAL_ADDR="anytype.purrspective.uk"
  - mkdir -p /opt/any-sync-bundle/data
  - |
    docker run -d \
      --name any-sync-bundle \
      --restart unless-stopped \
      -e ANY_SYNC_BUNDLE_INIT_EXTERNAL_ADDRS="$EXTERNAL_ADDR" \
      -p 33010:33010 \
      -p 33020:33020/udp \
      -v /opt/any-sync-bundle/data:/data \
      ghcr.io/grishy/any-sync-bundle:1.6.0-2026-08-18
  - 'echo "any-sync-bundle bootstrap complete: $(date)" > /var/log/anytype-bootstrap-done.log'
