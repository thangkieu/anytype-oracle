name: Catch OCI A1 Capacity

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  catch:
    runs-on: ubuntu-latest
    environment: PRD
    timeout-minutes: 20
    env:
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_COMPARTMENT_ID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_SUBNET_ID: ${{ vars.OCI_SUBNET_ID }}
      OCI_IMAGE_ID: ${{ vars.OCI_IMAGE_ID }}
      OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache OCI CLI
        id: cache-oci
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: oci-cli-3.92.0-${{ runner.os }}

      - name: Install OCI CLI
        if: steps.cache-oci.outputs.cache-hit != 'true'
        run: pip install oci-cli==3.92.0

      - name: Setup OCI credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=ap-singapore-2\nkey_file=/home/runner/.oci/private_key.pem\n' \
            "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$OCI_TENANCY_OCID" > ~/.oci/config
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/private_key.pem
          chmod 600 ~/.oci/config ~/.oci/private_key.pem
          echo "SUPPRESS_LABEL_WARNING=True" >> $GITHUB_ENV

      - name: Check for existing instance
        id: check
        run: |
          count=$(oci compute instance list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --display-name "anytype-server" \
            --lifecycle-state RUNNING \
            --query 'length(data)' \
            --raw-output 2>/dev/null || echo "0")
          echo "RUNNING=$count" >> $GITHUB_OUTPUT

      - name: Attempt instance launch
        id: launch
        if: steps.check.outputs.RUNNING == '0'
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ssh_key.pub

          result=$(oci compute instance launch \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --display-name "anytype-server" \
            --availability-domain "NjDi:AP-SINGAPORE-2-AD-1" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":1,"memoryInGBs":1}' \
            --subnet-id "$OCI_SUBNET_ID" \
            --image-id "$OCI_IMAGE_ID" \
            --ssh-authorized-keys-file /tmp/ssh_key.pub \
            --user-data-file live/singapore/anytype-server/cloud-init-rendered.yaml \
            --no-retry 2>&1) && EXIT=0 || EXIT=$?

          echo "$result"

          if [ $EXIT -eq 0 ]; then
            OCID=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])")
            echo "INSTANCE_OCID=$OCID" >> $GITHUB_OUTPUT
            echo "SUCCESS=true" >> $GITHUB_OUTPUT
          fi

      - name: Success summary
        if: steps.launch.outputs.SUCCESS == 'true'
        run: |
          echo "## Instance Created!" >> $GITHUB_STEP_SUMMARY
          echo "**OCID:** \`${{ steps.launch.outputs.INSTANCE_OCID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Import into Terraform:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cd live/singapore/anytype-server" >> $GITHUB_STEP_SUMMARY
          echo "terragrunt import oci_core_instance.anytype_server ${{ steps.launch.outputs.INSTANCE_OCID }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
